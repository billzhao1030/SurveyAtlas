<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurveyAtlas</title>
<meta name="description" content="SurveyAtlas — living literature surveys: a curated, classified, self-updating paper library with maps, timelines, benchmark leaderboards and Q&amp;A.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23232a5c'/%3E%3Cpath d='M8 23 L14 9 L18 17 L24 11' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='24' cy='11' r='2.6' fill='%23eda100'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>
  // apply the last-known look before first paint (the server copy wins once loaded)
  try {
    const l = JSON.parse(localStorage.getItem('atlas-look') || '{}'), r = document.documentElement;
    const t = l.theme || 'light';            // default look: light
    if (t !== 'auto') r.dataset.theme = t;
    r.dataset.bg = l.background || 'paper';
    r.dataset.accent = l.accent || 'indigo';
    if (l.bg_custom) r.style.setProperty('--bg-custom', l.bg_custom);
  } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/atlases" aria-label="All atlases">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M8 23 L14 9 L18 17 L24 11"/><circle cx="24" cy="11" r="2.6"/></svg>
    </a>
    <div class="switcher">
      <button class="atlas-btn" id="atlasBtn" aria-haspopup="true" aria-expanded="false"></button>
      <div class="atlas-menu" id="atlasMenu" role="menu"></div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#/" data-view="library">Library</a>
      <a href="#/" data-view="ask">Ask</a>
      <a href="#/" data-view="map">Map</a>
      <a href="#/" data-view="timeline">Timeline</a>
      <a href="#/" data-view="benchmarks">Benchmarks</a>
      <a href="#/" data-view="surveys">Surveys</a>
      <a href="#/" data-view="about">Pipeline</a>
    </nav>
    <div class="topbar-right">
      <span class="stamp" id="stamp"></span>
      <a class="icon-btn" id="helpBtn" href="#/guide" title="Guide" aria-label="Guide">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.6M12 16.8v.2"/></svg>
      </a>
      <button class="icon-btn" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="app">
  <div class="loading" id="loading"><div class="spinner"></div><span>Loading…</span></div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="dTitle">
    <button class="icon-btn drawer-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="drawerBody"></div>
  </div>
</aside>

<aside class="drawer settings" id="settings" aria-hidden="true">
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel" role="dialog" aria-modal="true" aria-label="Settings">
    <button class="icon-btn drawer-close" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="settingsBody"></div>
  </div>
</aside>

<div class="tooltip" id="tip" role="tooltip"></div>
<div class="toast" id="toast"></div>
<script src="app.js"></script>
</body>
</html>
