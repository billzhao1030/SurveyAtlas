<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Sign in</title>
<style>
  :root { --bg: #f6f5f1; --card: #ffffff; --ink: #1b1b22; --muted: #6b6b73; --line: #e3e2dc; --accent: #3b4fd8; --accent-ink: #2a3aa8; --bad: #c0392b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #15161b; --card: #1d1f26; --ink: #ececf1; --muted: #9a9aa6; --line: #2e3039; --accent: #8c9bff; --accent-ink: #b7c0ff; --bad: #ff7b6b; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 28px 26px 24px; box-shadow: 0 1px 2px rgba(20,20,30,.05), 0 12px 32px -16px rgba(20,20,30,.25); }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); display: grid; place-items: center; margin-bottom: 14px; }
  .logo svg { width: 22px; height: 22px; stroke: #fff; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-size: 19px; margin: 0 0 4px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13.5px; }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; letter-spacing: .02em; }
  input { width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
  button { width: 100%; margin-top: 14px; padding: 10px 12px; font-size: 15px; font-weight: 600; border: 0; border-radius: 9px;
           background: var(--accent); color: #fff; cursor: pointer; }
  button:hover { filter: brightness(1.06); }
  .err { color: var(--bad); font-size: 13px; margin: 10px 0 0; min-height: 1em; }
</style>
</head>
<body>
<form class="card" method="post" action="/login" autocomplete="off">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 19 10 5l4 9 2-4 4 9"/></svg></div>
  <h1>Atlas</h1>
  <p>This literature atlas is private. Enter the site password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" name="password" type="password" autofocus required>
  <button type="submit">Sign in</button>
  <div class="err">%ERROR%</div>
</form>
</body>
</html>
